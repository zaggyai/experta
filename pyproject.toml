[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "experta"
version = "1.9.4"
authors = [
  { name="Robert Bates", email="rbates@zaggy.ai" },
  { name="Roberto Abdelkader Martínez Pérez", email="robertomartinezp@gmail.com" },
]
description = "Expert Systems for Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "immutabledict~=4.2.0",
    "schema~=0.7.7",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "build",
    "black",
    "hypothesis",
]

[project.urls]
"Homepage" = "https://github.com/zaggyai/experta"
"Source" = "https://github.com/zaggyai/experta"
"Documentation" = "https://experta.readthedocs.io"
"Bug Tracker" = "https://github.com/zaggyai/experta/issues"

[project.scripts]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
